# Server Port (Render provides PORT dynamically or defaults to 8080/8081)
server.port=${PORT:8081}

# Spring Application Name
spring.application.name=finops-agent-assistant

# =========================================================
# DEFAULT DATASOURCE (H2 In-Memory for zero-config Cloud / Local Run)
# =========================================================
spring.datasource.url=jdbc:h2:mem:finopsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA Settings for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# CORS Configuration (Allows Vercel and localhost origins)
cors.allowed-origins=*

# =========================================================
# MYSQL PROFILE CONFIGURATION (Optional - for local MySQL server)
# To use MySQL, pass environment variable SPRING_PROFILES_ACTIVE=mysql
